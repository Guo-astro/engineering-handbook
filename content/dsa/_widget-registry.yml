# DSA Handbook — Cross-chapter widget registry (thin index)
#
# Thin index of every widget id, the file that holds its runtime spec, and
# the chapters that mount it. The full per-widget spec (panels, presets,
# keyframes, narration, commands, caps) lives in
# `content/dsa/widgets/<widget-id>.yml`.
#
# Schema:
#   <widget-id>:
#     spec: content/dsa/widgets/<widget-id>.yml      # required; file path
#     type: <widget type>                            # one of: single-panel,
#                                                    # dual-panel-shared,
#                                                    # three-way-shared,
#                                                    # four-way-shared,
#                                                    # editorial-single-panel
#     chapters: [<chapter-id>, ...]                  # PART.CHAPTER short form
#                                                    # (e.g., "3.0" = Part 3,
#                                                    # Chapter 0). CI maps to
#                                                    # chapter slugs via
#                                                    # _problem-registry.yml,
#                                                    # where primary_chapter
#                                                    # uses the full path form.
#     status: <complete | scaffold | pending>
#     # `complete`  — spec file has a full keyframe trace
#     # `scaffold`  — spec file exists with empty keyframes
#     # `pending`   — no spec file yet
#     notes: <free-form>                             # optional
#
# Naming conventions:
#   - Chapter widgets: `w-<NN>-<short-slug>` (e.g., w-08-two-pointers-3sum).
#   - Editorial widgets: `e-LC<NNN>-<short-slug>` (e.g., e-LC001-two-sum).
#     One per signature LC problem.
#
# Build CI's `make check:widget-registry` asserts:
#   (a) every chapter's `widgets:` ids exist here
#   (b) every entry's `spec:` file exists in `content/dsa/widgets/`
#   (c) every chapter listed under `chapters:` actually mounts the widget
#   (d) every editorial widget's LC ID has a matching entry in
#       `_problem-registry.yml`
#
# Version: 1.0

# =============================================================================
# Part 0 — Foundations
# =============================================================================

w-01-recursion-call-stack:
  spec: content/dsa/widgets/w-01-recursion-call-stack.yml
  type: dual-panel-shared
  chapters: ["0.2", "7.0"]
  status: complete
  notes: |
    Panel-a (chapter 0.2) animates the push/base/pop trace of factorial(n)
    so the call stack is visible as a physical artifact. Canonical input
    n=4; 12 steps; cap n=8 (19 steps under the 25-step ceiling).
    Panel-b (chapter 7.0) shows three call-stack panels side-by-side —
    linear (fib_linear(3)), tree (fib_tree(3)), divide-and-conquer
    (merge_sort([3,1,2])) — at the same instant. Combined panel-b trace
    is 30 events (8 + 10 + 12) so the reader sees three shapes of
    recursion as physically distinct stack behaviors.

