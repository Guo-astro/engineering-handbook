  type: dual-panel-shared
  chapters: ["1.3", "1.4"]
  status: complete
  notes: |
    Panel-a (chapter 1.3, clean insert + lookup on a 4-bucket chained
    table): 14 steps. Canonical input inserts apple/banana/cherry into
    distinct buckets, exercises duplicate-key update on bucket 1, then
    a hit lookup on banana and a miss lookup on grape that scans
    bucket 3's single-entry chain.
    Panel-b (chapter 1.4, collision storm + load-factor-triggered
    resize): 12 steps. Canonical input inserts 5, 1, 9, 13, 17 — every
    key hashes to bucket 1 at capacity 4 — drives the table past load
    factor 0.75 on the fourth insert, doubles to capacity 8, and
    rehashes so the chain at bucket 1 falls from length 4 back to
    length 3. Combined: 26/50 steps under cap.

