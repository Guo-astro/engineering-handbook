w-38-kmp:
  spec: content/dsa/widgets/w-38-kmp.yml
  type: single-panel
  chapters: ["12.2"]
  status: complete
  notes: |
    Chapter 12.2 mechanics widget. Animates KMP's two phases on the
    canonical input P = "ABABCABAB" / T = "ABABDABACDABABCABAB" over
    36 steps: 11 Phase-A steps building the failure function lps =
    [0, 0, 1, 2, 0, 1, 2, 3, 4], then 25 Phase-B steps walking the
    matching pass to the first match at T-index 10. The pedagogically
    critical moments are step 4 (lps construction's first fallback
    via length = lps[1] = 0, showing the j-1 indexing convention)
    and step 16 (matching pass's first fallback via j = lps[3] = 2,
    showing that on a mismatch i never moves backwards while j jumps
    to the longest viable prefix). Trace transcribed verbatim from
     step buffer; deterministic replay against the §2.2
    Python reference produces byte-identical output (
    Check 4). Reduced-motion fallback samples {0, 4, 10, 11, 22, 35}.
    Note: specified id w-32-kmp-failure-function;
    next-free-id rule lands at w-38 (w-32 was already claimed by
    Knapsack in 9.5; w-37/w-39/w-40 by Bellman-Ford / Huffman /
    Z-array in 8.10 / 10.3 / 12.3).

w-40-z-array:
  spec: content/dsa/widgets/w-40-z-array.yml
  type: single-panel
  chapters: ["12.3"]
  status: complete
  notes: |
    Chapter 12.3 mechanics widget. Animates Z-array construction on the
    canonical input s = "aabaabcaab" (length 10) over 19 steps, exercising
    all three branches of the main loop: trivial init outside [l, r) at
    steps 1/4/6/11/13, mirror-inside (z[i] = z[i-l] capped) at steps 9/10/16/17,
    and window slides at steps 3/8/15. The pedagogically critical moment is
    step 9, the first mirror reuse: z[4] is set to 1 with no character
    comparisons because step 8's slide proved s[3:6] equals s[0:3]; that
    inheritance is the entire amortized-linear argument made visible.
    Trace transcribed verbatim step buffer; deterministic
    replay against the §2.2 Python reference produces byte-identical output
    . Reduced-motion fallback samples
    {0, 3, 8, 9, 15, 18}. Three additional presets: "aaaa" (degenerate,
    mirror-clip on every step after init), "aaabaaaab" (triggers the
    mirror-clip-with-extension branch the canonical input omits), and
    "ll#hello" (the pattern-matching reduction). Note:
    specified the id as w-41-z-algorithm; the next-free-id rule lands at
    w-40 because w-39 was claimed by Huffman encoding in 10.3.

