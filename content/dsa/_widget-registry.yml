w-39-huffman-encoding:
  spec: content/dsa/widgets/w-39-huffman-encoding.yml
  type: single-panel
  chapters: ["10.3"]
  status: complete
  notes: |
    Chapter 10.3 mechanics widget. Animates four phases on the CLRS Fig 16.4
    canonical input freqs={a:5, b:9, c:12, d:13, e:16, f:45}: init (6 leaf
    enqueues), extract-2-merge (5 merges × 3 events = 15 steps), tree-built
    (root #10 surfaces at weight 100), codeword-walk (DFS pre-order emits
    one bitstring per leaf). 38-step trace under the 1000-step cap; trace
    transcribed verbatim step buffer (replay-verified
    bit-for-bit against the §2.2 Python reference on 2026-05-20). Reuses
    the heap-sift PQ panel module from w-18 (heap operations) and w-29
    (Dijkstra) per widget-architecture.md Appendix A item 9. Final codewords
    {f:"0", c:"100", d:"101", e:"111", a:"1100", b:"1101"} are one valid
    Huffman code for these frequencies; codeword *lengths* {1,3,3,3,4,4}
    are canonical, bit assignments are not (siblings can be swapped without
    changing optimality). Total weighted path length 224 bits matches CLRS
    Fig 16.4. Three additional presets: all-equal weights (balanced fixed-
    length code), power-of-two weights (skewed Fibonacci-like tree),
    single-symbol degenerate (n=1 forces a dummy parent so codeword is "0"
    not the empty string). Note: specified this widget id
    as w-39 (w-37 was already claimed by Bellman-Ford in chapter 8.10).

