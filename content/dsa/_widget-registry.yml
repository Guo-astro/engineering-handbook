    partition, pivot place, recurse-decide, answer. Where w-06 zooms
    in on a single Lomuto pass (Level 2 i/j sweep), this widget shows
    the across-recursion behavior — one side per level is the entire
    reason expected linear holds. Canonical input
    nums = [3, 2, 1, 5, 6, 4], k = 2; 14 steps under the 50-step cap.
    Pivot rule frozen to deterministic pivot=lo for trace
    reproducibility; production code randomises (chapter prose states
    the difference). Three pedagogical-trap presets: all-equal (Lomuto
    Theta(n^2) failure), duplicates (index-conversion exercise), k-th
    smallest (extreme target).

