    STRETCH for 8.11. Kruskal-with-edge-perturbation: compute the
    baseline MST weight W*; for every edge e, run Kruskal twice (once
    excluding e, once forcing e to be accepted first). If exclusion
    raises the weight above W*, e is critical; if inclusion ties W* but
    exclusion does not raise it, e is pseudo-critical. Total time
    O(E^2 alpha(V)). Pulls in the cycle property and the cut property
    simultaneously and exercises Kruskal at a level the chapter does
    not otherwise teach. Free on LeetCode (Hard), so it carries the
    chapter's Hard-band STRETCH slot.

