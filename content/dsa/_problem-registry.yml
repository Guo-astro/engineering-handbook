968:
  title: "Binary Tree Cameras"
  difficulty: Hard
  url: https://leetcode.com/problems/binary-tree-cameras/
  primary_chapter: part-9-dynamic-programming/13-tree-dp
  secondary_chapters: []
  pattern_tag: tree-dp-greedy-state
  star: false
  premium: false
  assignment_notes: |
    Hard CORE for 9.13. Three-state DP per node (NEEDS_COVER /
    HAS_CAMERA / COVERED) reduced to a greedy decision via the
    invariant that the optimal placement always pushes cameras as
    high in the tree as the constraint allows: a camera at a parent
    covers strictly more nodes than the same camera at a leaf, so
    place a camera only when forced by a NEEDS_COVER child. The
    greedy reduction collapses what would be a 9-pair-per-node DP
    table to one state per node, holding O(n) time and O(h) space.
    The wrapper-time camera at the root (when dfs returns NEEDS_COVER)
    is the most-missed line on first attempt.
834:
  title: "Sum of Distances in Tree"
  difficulty: Hard
  url: https://leetcode.com/problems/sum-of-distances-in-tree/
  primary_chapter: part-9-dynamic-programming/13-tree-dp
  secondary_chapters: []
  pattern_tag: tree-dp-rerooting
  star: false
  premium: false
  assignment_notes: |
    Hard STRETCH for 9.13. The canonical re-rooting problem: the answer
    is wanted at every node as the root, not just at one. Naive O(n^2)
    BFS-from-each-node times out on the 30,000-node constraint. The
    re-rooting trick is two passes — post-order computes count[u] and
    answer[0] (rooted at node 0); pre-order moves the root from u to
    each child v in O(1) via answer[v] = answer[u] - count[v] +
    (n - count[v]). The technique is named in the USACO Guide's
    "DP on trees - solving for all roots" Gold module and earns its
    own H3 in the chapter under "Re-rooting: the answer at every node."
979:
  title: "Distribute Coins in Binary Tree"
  difficulty: Medium
  url: https://leetcode.com/problems/distribute-coins-in-binary-tree/
  primary_chapter: part-9-dynamic-programming/13-tree-dp
  secondary_chapters: []
  pattern_tag: tree-dp-flow-on-edges
  star: false
  premium: false
  assignment_notes: |
    Medium STRETCH for 9.13. Reuses the post-order shape with a
    different observation: the number of coin-moves required on each
    edge is fully determined by the imbalance between the subtrees on
    either side of the edge. The helper returns net coin imbalance
    (coins below this subtree minus nodes below this subtree); a
    closure-captured global accumulates abs(imbalance) at every node,
    which counts moves on the edge from this node to its parent. One
    pass; O(n). Cleanest "every edge contributes once to the answer"
    teaching example in the LC ladder.

