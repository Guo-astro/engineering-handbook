    The chapter's signature ★. LC 362 is the canonical bucket-array
    hit-counter teaching problem: 300 1-second buckets indexed by
    `t % 300`, each holding (bucket_timestamp, count). hit() is O(1)
    and getHits() is O(W/granularity) = O(300), constant in W. Premium
    means the chapter cannot run a four-language verified test against
