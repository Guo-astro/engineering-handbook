  title: "Minimum Number of Removals to Make Mountain Array"
  difficulty: Hard
  url: https://leetcode.com/problems/minimum-number-of-removals-to-make-mountain-array/
  primary_chapter: part-9-dynamic-programming/08-lis-quadratic
  secondary_chapters: []
  pattern_tag: bitonic-lis
  star: false
  premium: false
  assignment_notes: |
    CORE Hard for 9.8. Bidirectional LIS: run the n^2 DP twice -- left[i]
    forward sweep, right[i] reverse sweep with the inverted predicate.
    Longest mountain centered at i has length left[i] + right[i] - 1,
    valid only when both halves are non-trivial (both > 1). Answer:
    n - max valid mountain length. The "both halves > 1" gate is the
    most-missed line; without it the algorithm reports impossible
    mountains and undercounts removals. O(n^2) time, O(n) space.
376:
  title: "Wiggle Subsequence"
  difficulty: Medium
  url: https://leetcode.com/problems/wiggle-subsequence/
  primary_chapter: part-9-dynamic-programming/08-lis-quadratic
  secondary_chapters: []
  pattern_tag: wiggle-two-state-dp
  star: false
  premium: false
  assignment_notes: |
    STRETCH for 9.8. The "look-back DP that collapsed" -- same family
    as LC 300, but the order predicate's locality (depends only on
    nums[i] vs nums[i-1]) lets the state collapse from O(n^2) to O(n)
    with two parallel one-cell sweeps: up[i] tracks longest wiggle
    ending at i with last step UP; down[i] same with last step DOWN.
    Teaches the reader when the n^2 framework simplifies. Reference:
    Python only at this rung.
1027:
  title: "Longest Arithmetic Subsequence"
  difficulty: Medium
  url: https://leetcode.com/problems/longest-arithmetic-subsequence/
  primary_chapter: part-9-dynamic-programming/08-lis-quadratic
  secondary_chapters: []
  pattern_tag: lis-keyed-by-difference
  star: false
  premium: false
  assignment_notes: |
    STRETCH for 9.8. State extends to two dimensions: dp[i][d] = length
    of longest arithmetic subsequence ending at index i with common
    difference d. For each (j, i) with j < i, compute d = nums[i] -
    nums[j] and set dp[i][d] = dp[j][d] + 1 (default 2 for the first
    pair). Use a hash map per i to avoid materializing the dense
    [i][d] table when d ranges widely. O(n^2) time, O(n^2) space worst
    case. Demonstrates the framework when the order predicate is
    parameterized by a value computed from the (j, i) pair. Reference:
    Python only at this rung.

