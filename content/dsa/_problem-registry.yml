# 1.1 dynamic-array-internals
# Depth chapter on amortized analysis + geometric resizing. Canonical
# Easy/Medium "in-place array" problems are owned by 1.0 Arrays. Remaining
# problems here are "explicit dynamic-array data structure with capacity vs
# length" Mediums. The cost-model proof is the chapter's reason to exist;
# the LC ladder is supplemental.
1146:
  title: "Snapshot Array"
  difficulty: Medium
  url: https://leetcode.com/problems/snapshot-array/
  primary_chapter: part-1-linear-data-structures/01-dynamic-array-internals
  secondary_chapters: []
  pattern_tag: array-design-per-cell-version-list
  star: true
  premium: false
  assignment_notes: |
    Quintessential "explicit dynamic-array data structure" problem. Each
    index maintains its own dynamic array of (snap_id, value) entries;
    demonstrates capacity-vs-length per-cell and the cost of repeated
    append into a sub-array.
919:
  title: "Complete Binary Tree Inserter"
  difficulty: Medium
  url: https://leetcode.com/problems/complete-binary-tree-inserter/
  primary_chapter: part-1-linear-data-structures/01-dynamic-array-internals
  secondary_chapters: []
  pattern_tag: array-backed-tree-with-index-arithmetic
  star: false
  premium: false
  assignment_notes: |
    Backing a tree by an ArrayList/vector and indexing children at
    2i+1, 2i+2. Each insert is amortized O(1) because the backing
    structure is a dynamic array; the parent lookup is O(1). Demonstrates
    that "tree-ness" is sometimes the array's array-ness with index
    arithmetic.
622:
  title: "Design Circular Queue"
  difficulty: Medium
  url: https://leetcode.com/problems/design-circular-queue/
  primary_chapter: part-1-linear-data-structures/01-dynamic-array-internals
  secondary_chapters:
    - part-1-linear-data-structures/06-queues-deques  # see also (queue mechanics)
  pattern_tag: array-buffer-bounded-with-modular-indexing
  star: false
  premium: false
  assignment_notes: |
    Capacity-vs-length made explicit: the queue takes a k parameter
    (physical capacity) and tracks logical size via count, separate from
    the buffer's physical length. Demonstrates that not all dynamic-array-
    flavored designs need to grow; some are explicitly bounded with
    wrap-around.

