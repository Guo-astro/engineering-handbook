    CORE in 9.4. 3D 0/1 knapsack with two simultaneous constraints
    (members AND minProfit). The profit-clamping trick — any actual
    profit beyond minProfit collapses to the same state, since the
    question is "at least minProfit" — is the interview tell that
    Hard problems often invoke. Demonstrates pattern transfer beyond
