    4-direction grid. The visited mark persists for the whole run
    (no restoration) because each index is single-use across the
    entire search, not just the current path — a useful contrast
    with LC 79's per-path mark-and-restore. Could appear as STRETCH
    in 8.0 graph-representation when implicit graphs are taught.
