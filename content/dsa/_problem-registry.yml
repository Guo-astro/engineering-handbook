1032:
  title: "Stream of Characters"
  difficulty: Hard
  url: https://leetcode.com/problems/stream-of-characters/
  primary_chapter: part-12-strings-pattern-matching/04-aho-corasick
  secondary_chapters: []
  pattern_tag: trie-with-failure-link-streaming
  star: true
  premium: false
  assignment_notes: |
    PRIMARY + signature ★ for 12.4 and the chapter's canonical_test. The
    cleanest LC application of trie-with-failure-link reasoning: each
    query(c) advances the persistent automaton state by one character and
    answers "does any pattern end here?" in O(1) amortized. The reverse-
    trie variant frequently shown in walkccc/algomap solutions is the
    same automaton with the dictionary reversed; the chapter teaches the
    forward AC formulation because that is the algorithm Snort, YARA,
    and fgrep run. Full four-language reference at
    04-aho-corasick/lc-1032/sol.{py,java,cpp,go}.
745:
  title: "Prefix and Suffix Search"
  difficulty: Hard
  url: https://leetcode.com/problems/prefix-and-suffix-search/
  primary_chapter: part-12-strings-pattern-matching/04-aho-corasick
  secondary_chapters:
    - part-6-trees-heaps/08-tries   # see also: trie multi-key indexing
    - part-13-design-the-data-structure/04-trie-autocomplete  # CORE-Hard citation: per-node max-index cache mirrors per-node top-k cache
  pattern_tag: bidirectional-trie-multi-key
  star: false
  premium: false
  assignment_notes: |
    CORE Hard for 12.4. Generalizes AC's "preprocess once, query many"
    framing to bidirectional matching: build a trie keyed on
    `suffix#word` (one pair per word, one trie node per (suffix, word)
    pair), then a query (prefix, suffix) becomes a single trie walk on
    `suffix#prefix`. Hard because of the index design; teaches that the
    multi-pattern preprocessing idea generalizes beyond left-to-right.
    Reference: Python only at this rung; full four-language coverage
    deferred.
648:
  title: "Replace Words"
  difficulty: Medium
  url: https://leetcode.com/problems/replace-words/
  primary_chapter: part-12-strings-pattern-matching/04-aho-corasick
  secondary_chapters:
    - part-6-trees-heaps/08-tries   # see also: trie shortest-prefix scan
  pattern_tag: trie-shortest-prefix-match
  star: false
  premium: false
  assignment_notes: |
    CORE Medium for 12.4. Multi-pattern dictionary application: insert
    every root into a trie, then for each word in the sentence walk the
    trie one character at a time and stop at the first is_end. AC's
    full failure-link machinery is overkill (the matching is anchored at
    word starts, no overlap), but the chapter uses LC 648 to teach the
    "trie scan against a stream of inputs" mental model that AC then
    extends with failure links. Reference: Python only at this rung.

