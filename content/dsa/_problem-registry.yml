124:
  title: "Binary Tree Maximum Path Sum"
  difficulty: Hard
  url: https://leetcode.com/problems/binary-tree-maximum-path-sum/
  primary_chapter: part-9-dynamic-programming/13-tree-dp
  secondary_chapters: []
  pattern_tag: tree-dp-dual-quantity-with-clamp
  star: false
  premium: false
  assignment_notes: |
    Hard CORE for 9.13. Canonical "what to return vs what to compare
    globally" split — a bent path through this node is compared against
    the global answer, but a straight-down chain is what the parent gets,
    because a parent attaching itself to an already-bent child path
    produces a two-bend shape that is no longer a path under LC 124's
    definition. The negative-clamp `max(child_gain, 0)` is the
    optimization, not a defensive guard: extending into a negative-sum
    subtree is worse than extending nowhere. Multi-language reference at
    13-tree-dp/lc-124/sol.{py,java,cpp,go}, copied verbatim from research
    §2.2-2.5 (verification_status: passed_with_caveats; all 4 languages
    PASS canonical test cases [-10,9,20,null,null,15,7]→42; [1,2,3]→6;
