  secondary_chapters: []
  pattern_tag: knapsack-01-count-subsets
  star: false
  premium: false
  assignment_notes: |
    CORE in 9.4. Signed-sum reformulation: with P = sum of +signed elements
    and N = sum of -signed elements, P + N = total and P - N = target, so
    P = (total + target) / 2. The signed-expression count collapses to
    "count subsets of nums summing to (total + target) / 2", which is the
    canonical 0/1 knapsack count-subsets variant (boolean OR replaced by
    integer addition). Teaches the reformulation skill — the cleverness
    is the algebra, the DP itself is straightforward. Reference: Python
    only at this rung; documents the reformulation.
