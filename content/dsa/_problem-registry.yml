# 9.14 bitmask-dp
847:
  title: "Shortest Path Visiting All Nodes"
  difficulty: Hard
  url: https://leetcode.com/problems/shortest-path-visiting-all-nodes/
  primary_chapter: part-9-dynamic-programming/14-bitmask-dp
  secondary_chapters: []
  pattern_tag: bitmask-bfs-state-search
  star: true
  premium: false
  assignment_notes: |
    PRIMARY + signature ★ for 9.14. The canonical "small n + visit-all"
    bitmask state-search problem on LeetCode. State (node, mask): which
    bit-subset of n <= 12 nodes has been visited and which one is current.
    BFS over n * 2^n states, transitions iterate node neighbors and OR
    the destination bit into the mask; first dequeued (any_node,
    full_mask) state's distance is the answer. Distinguishes from research
    §2's stickers canonical (LC 691) by carrying the (mask, last) state
    shape that the chapter teaches as the second core variant. Full
    four-language reference at 9.14/lc-847/sol.{py,java,cpp,go}; teaches
    the bitmask-BFS interpretation of the same state space Held-Karp
    1962 used for TSP. Edge weights are unit (BFS suffices); the chapter
    prose flags the Held-Karp generalization to weighted edges as the
    bridge to TSP-style problems.
526:
  title: "Beautiful Arrangement"
  difficulty: Medium
  url: https://leetcode.com/problems/beautiful-arrangement/
  primary_chapter: part-9-dynamic-programming/14-bitmask-dp
  secondary_chapters: []
  pattern_tag: bitmask-dp-permutation
  star: false
  premium: false
  assignment_notes: |
    CORE Medium for 9.14. The gentlest entry into the chapter family.
    Permutation counting with a per-position divisibility predicate;
    pure bitmask DP shape dp[mask] = number of valid permutations using
    the values whose bits are set in mask. Implicit position pointer is
    popcount(mask) — no separate (mask, last) state needed. Constraint
    n <= 15 makes the chapter's "n <= 20 ceiling" claim immediately
    concrete: 2^15 = 32768 states, sub-second across all four languages.
    Reference: Python only at this rung; full four-language coverage
    deferred.
698:
  title: "Partition to K Equal Sum Subsets"
  difficulty: Medium
  url: https://leetcode.com/problems/partition-to-k-equal-sum-subsets/
  primary_chapter: part-9-dynamic-programming/14-bitmask-dp
  secondary_chapters: []
  pattern_tag: bitmask-dp-partition
  star: false
  premium: false
  assignment_notes: |
    CORE Medium for 9.14. The partition variant: state is a mask over
    which elements have been placed into some subset and a residual sum
    tracking the current subset's accumulator. dp[mask] = is there an
    assignment of the bits in mask to k subsets such that each subset
    sums to total / k. n <= 16; 2^16 = 65536 states, well within budget.
    Demonstrates the partition flavor of bitmask DP that LC 698 shares
    with LC 1986. Reference: Python only at this rung; full four-
    language coverage deferred.
1986:
  title: "Minimum Number of Work Sessions to Finish the Tasks"
