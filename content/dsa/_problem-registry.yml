1163:
  title: "Last Substring in Lexicographical Order"
  difficulty: Hard
  url: https://leetcode.com/problems/last-substring-in-lexicographical-order/
  primary_chapter: part-12-strings-pattern-matching/03-z-algorithm
  secondary_chapters: []
  pattern_tag: z-algorithm
  star: false
  premium: false
  assignment_notes: |
    CORE Hard for 12.3. Adversarial-input Hard: brute-force comparison
    is O(n^2) and the test set includes "aaaa...aaab"-style strings
    designed to defeat naive solutions. The textbook two-pointer
    expansion uses the [l, r) match-window invariant directly: when
    the candidate-best suffix at i matches a prefix-extension at j,
    the comparison can skip ahead by the matched-prefix length.
    Reference: Python only at this rung.
3008:
  title: "Find Beautiful Indices in the Given Array II"
  difficulty: Hard
  url: https://leetcode.com/problems/find-beautiful-indices-in-the-given-array-ii/
  primary_chapter: part-12-strings-pattern-matching/03-z-algorithm
  secondary_chapters: []
  pattern_tag: z-algorithm
  star: true
  premium: false
  assignment_notes: |
    CORE Hard ★ for 12.3 and the chapter's signature problem. Find all
    positions where pattern `a` occurs in `s` such that pattern `b`
    occurs within distance `k`. The O(|s| + |a| + |b|) solution computes
    z(a + # + s) and z(b + # + s) to extract two sorted index lists,
    then sweeps with a two-pointer / binary-search for the distance
    constraint. Constraints push naive `s.find(a)` to TLE; the
    Z-algorithm pre-pass is what makes the optimal time bound reachable.
    Editorial widget e-LC3008-find-beautiful-indices is tracked
    separately. Reference: Python only at this rung; the chapter's
    canonical_test (multi-language verification battery) is delegated
    to the simpler LC 1668 worked example.
3034:
  title: "Number of Subarrays That Match a Pattern I"
  difficulty: Medium
  url: https://leetcode.com/problems/number-of-subarrays-that-match-a-pattern-i/
  primary_chapter: part-12-strings-pattern-matching/03-z-algorithm
  secondary_chapters:
    - part-12-strings-pattern-matching/02-kmp
  pattern_tag: z-algorithm
  star: false
  premium: false
  assignment_notes: |
    STRETCH Medium for 12.3. Pattern matching on a transformed integer
    array: convert `nums` into (+1, 0, -1) direction codes, then count
    occurrences of `pattern` as a substring of the codes via Z-algorithm
    in O(n + m). Demonstrates the same algorithm extends past characters
    to any equality predicate; provides the Medium for the
    core-emh-via-stretch curation flag. Reference: Python only at this
    rung.
214:
  title: "Shortest Palindrome"
  difficulty: Hard
  url: https://leetcode.com/problems/shortest-palindrome/
  primary_chapter: part-12-strings-pattern-matching/03-z-algorithm
  secondary_chapters:
    - part-12-strings-pattern-matching/02-kmp
  pattern_tag: z-algorithm
  star: false
  premium: false
  assignment_notes: |
    STRETCH Hard for 12.3. The textbook Z-algorithm-via-reversed-string
    trick: compute z(s + # + reverse(s)) and find the largest i with
    z[i] + i == |concatenated| to extract the longest palindromic
    prefix. KMP and Manacher's both apply; the Z framing is the
    cleanest of the three and reinforces the "Z on a synthesized
    concat" trick from CORE LC 3008. Reference: Python only at this
    rung.

