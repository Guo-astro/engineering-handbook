# 9.8 lis-quadratic
300:
  title: "Longest Increasing Subsequence"
  difficulty: Medium
  url: https://leetcode.com/problems/longest-increasing-subsequence/
  primary_chapter: part-9-dynamic-programming/08-lis-quadratic
  secondary_chapters:
    - part-9-dynamic-programming/09-lis-patience-sort  # cites the n^2 baseline before introducing patience-sort
  pattern_tag: lis-quadratic-dp
  star: true
  premium: false
  assignment_notes: |
    PRIMARY + signature star for 9.8. The canonical n^2 LIS DP, the
    chapter's worked example. dp[i] = "longest STRICTLY increasing
    subsequence ending exactly at index i, with nums[i] as last
    element"; recurrence dp[i] = 1 + max(dp[j] for j < i if nums[j]
    < nums[i]), default 0. O(n^2) time, O(n) space. Full multi-
    language reference at 08-lis-quadratic/lc-300/sol.{py,java,cpp,go};
    canonical_test fixture covers [10,9,2,5,3,7,101,18]->4;
    [0,1,0,3,2,3]->4; [7,7,7,7,7]->1. Cited but NOT taken as CORE in
    9.9 (the patience-sort chapter introduces the n log n improvement
    using LC 300 as motivating example, then takes LC 354 as its
    primary worked problem).
673:
  title: "Number of Longest Increasing Subsequence"
  difficulty: Medium
  url: https://leetcode.com/problems/number-of-longest-increasing-subsequence/
  primary_chapter: part-9-dynamic-programming/08-lis-quadratic
  secondary_chapters: []
  pattern_tag: lis-with-count
  star: false
  premium: false
  assignment_notes: |
    CORE Medium for 9.8. Direct extension of LC 300: same outer-i /
    inner-j loops, augment dp[] with a parallel count[] array.
    Two-branch update inside the inner loop: if length[j]+1 strictly
    exceeds length[i], reset count[i] = count[j]; if it ties, accumulate
    count[i] += count[j]. The "tie => accumulate" branch is the
    most-missed line on this problem family in interview settings.
    Final answer: sum count[i] over all i where length[i] == max(length).
    O(n^2) time, O(n) space.
