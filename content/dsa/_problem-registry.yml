# DSA Handbook — Cross-chapter LC problem registry
#
# Single source of truth for chapter ownership of every LC problem in the
# handbook. The build pipeline validates that:
#   (a) no LC appears as `primary_chapter` for two chapters
#   (b) every chapter ladder problem has an entry here
#   (c) every entry's `url` resolves to leetcode.com
#
# Schema:
#   <lc_id>:                                             # integer LC number
#     title: <human-readable title>                      # exact LC title
#     difficulty: <Easy|Medium|Hard>                     # current LC difficulty
#     url: https://leetcode.com/problems/<slug>/         # canonical URL
#     primary_chapter: <part-N-slug/NN-chapter-slug>     # owning chapter
#     secondary_chapters: [...]                          # chapters citing it
#     pattern_tag: <single dominant pattern>             # one tag, hyphen-cased
#     star: <true|false>                                 # signature problem
#     premium: <true|false>                              # leetcode-premium-only
#     premium_alternative: <lc_id>                       # required if premium: true
#     assignment_notes: <free-form rationale>            # required when chapters
#                                                        # genuinely overlap
#
# Titles, difficulties, and URL slugs verified against leetcode.com.
#
# Version: 1.0

# =============================================================================
# Part 0 — Foundations
# =============================================================================

# 0.2 recursion-mental-model
509:
  title: "Fibonacci Number"
  difficulty: Easy
  url: https://leetcode.com/problems/fibonacci-number/
  primary_chapter: part-0-foundations/02-recursion-mental-model
  secondary_chapters:
    - part-9-dynamic-programming/00-dp-recursion-to-memo
    - part-7-recursion-backtracking/00-recursion-patterns  # cited as the linear-vs-tree shape contrast
  pattern_tag: recursion-linear
  star: true
  premium: false
  assignment_notes: |
    PRIMARY in 0.2 because the chapter teaches the recursion mental model
    itself, not the DP optimization. LC 509 is the canonical first-recursion
    problem: the prompt's specification ("F(n) = F(n-1) + F(n-2)") is itself
    recursive, the strongest possible signal to reach for the pattern.
    Secondary in 9.0 (top-down DP), where the same problem is the vehicle
    for memoizing a naive tree recursion.

