    into "split into two groups with minimum positive difference",
    which collapses to "find subset closest to half the total". The
    answer is total - 2 * S where S is the largest reachable subset
    sum ≤ total / 2. Walks the dp array after the fill phase to find
    the largest True cell ≤ total / 2 — the optimization variant
    where pure boolean reachability falls short. Reference: Python
    only at this rung; documents the reformulation.

