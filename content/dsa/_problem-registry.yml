#   timestamps) are structurally Hard; LC has no canonical Easy at this
#   theme. LC 207 / 210 / 802 / 269 are PRIMARY-owned by 8.4 (Kahn's),
#   referenced from 8.5 only as alternate-algorithm see-alsos.
1192:
  title: "Critical Connections in a Network"
  difficulty: Hard
  url: https://leetcode.com/problems/critical-connections-in-a-network/
  primary_chapter: part-8-graphs/05-topological-sort-dfs
  secondary_chapters: []
  pattern_tag: dfs-postorder
  star: true
  premium: false
  assignment_notes: |
    PRIMARY + signature ★ for 8.5. Tarjan's bridge-finding algorithm
    via DFS post-order timestamps (`disc[u]` = entry order, `low[u]` =
    minimum disc reachable from u's subtree). The canonical "post-order
    timestamp" application: a tree edge (u, v) is a bridge iff
    low[v] > disc[u], and low[v] is computable only because the
    update happens AFTER recursing on v — exactly the post-order
    moment that defines this chapter. Chapter widget animates LC 207
    on the same DAG as 8.4's Kahn-flavored panel; LC 1192 itself is
    the chapter's worked-example bridge target (one paragraph in
    "Where the post-order moment pays off").
332:
  title: "Reconstruct Itinerary"
  difficulty: Hard
  url: https://leetcode.com/problems/reconstruct-itinerary/
  primary_chapter: part-8-graphs/05-topological-sort-dfs
  secondary_chapters: []
  pattern_tag: dfs-postorder
  star: false
  premium: false
  assignment_notes: |
    CORE Hard for 8.5. Hierholzer's algorithm: greedily descend on
    the lex-smallest available outgoing edge until you stick at a
    dead-end vertex, then prepend the dead-end into the result on
    the way out of recursion. The "result built by post-order, then
    reversed" pattern is identical to topological sort, only on
    edges instead of vertices — the chapter's pattern proof point.
    Lexical ordering enforced by sorting each adjacency list (or
    using a min-heap per vertex). LeetCode guarantees the input
    admits a valid Eulerian path from JFK; production code should
    validate Euler-path conditions (at most 2 vertices with odd
    in/out-degree imbalance) but LC test set skips this.
2360:
  title: "Longest Cycle in a Graph"
  difficulty: Hard
  url: https://leetcode.com/problems/longest-cycle-in-a-graph/
  primary_chapter: part-8-graphs/05-topological-sort-dfs
  secondary_chapters: []
  pattern_tag: dfs-postorder
  star: false
  premium: false
  assignment_notes: |
    CORE Hard for 8.5. Functional-graph (each vertex has at most one
    outgoing edge) cycle-length problem. DFS from each unvisited
    vertex follows the unique chain until it revisits a vertex; if
    that vertex is on the *current* DFS path (GRAY), the cycle
    length is `current_timestamp - disc[seen]`. Pure DFS post-order
    timestamp pattern applied to cycle-length measurement, not just
    cycle existence — the natural Hard companion to LC 1192's
    Tarjan timestamps.
444:
