  star: true
  premium: false
  assignment_notes: |
    PRIMARY + signature ★ for 9.3. The chapter's canonical_test and the
    closed-form-alphabet exemplar of string-prefix decision DP. Two-line
    recurrence: `dp[i] += dp[i-1]` if `s[i-1] != '0'`, plus `dp[i] += dp[i-2]`
    if `int(s[i-2:i]) in [10,26]`. Lifts to O(1) space via the rolling-window
    trick (only `dp[i-1]` and `dp[i-2]` live across iterations). Acceptance
    rate ≈ 35% on LC, the lowest of any Medium DP problem on the prefix-
    decision pattern — the `'0'` rule is the chapter's biggest pitfall.
    Full multi-language reference at 03-dp-decode-word-break/lc-91/sol.
    {py,java,cpp,go}; canonical test verifies cases ["226","0","10","12",
    "06","27","2101"] → [3,0,1,2,0,1,1] in all four languages.
