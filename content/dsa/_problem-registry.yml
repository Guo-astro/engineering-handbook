    STRETCH for 9.14. Bin-packing flavor of bitmask DP: state is the
    mask of completed tasks plus the current session's used time;
    transitions add one task to the current session or open a new
    session. n <= 14 tasks. The chapter cites LC 1986 to demonstrate
    the family extends past pure set-cover and TSP into resource-
