    Hard application of "schedule events to avoid a state collision".
    Same scaffolding as a rate limiter that must place "drain" events
    to prevent overflow: HashMap of (lake -> last_fill_day) tracks the
    fill state, a sorted set of free dry days supports binary-search
    placement of the next drain, and the greedy algorithm is the
    earliest free dry day strictly after the lake's last fill. Owns
    the CORE-Hard slot for 13.3 because the algorithmic shape (state
    that fills and drains, with eviction) is the chapter's pattern,
    not because the surface problem is about lakes.
