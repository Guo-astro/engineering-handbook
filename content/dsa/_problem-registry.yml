    the DESC sort surfaces them in decreasing order so a strict-LIS skips
    the duplicate). Full multi-language reference at
    09-lis-patience-sort/lc-354/sol.{py,java,cpp,go}; canonical_test
    fixture covers [[5,4],[6,4],[6,7],[2,3]]=3 and [[1,1],[1,1],[1,1]]=1.
