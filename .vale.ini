StylesPath = .vale/styles
MinAlertLevel = warning

Packages = proselint, write-good, alex, Readability

[*.md]
BasedOnStyles = Vale, proselint, write-good

# Project-specific rules
Vale.Spelling = NO    # typos handles this
Vale.Repetition = warning
Vale.Terms = YES

# Disable overly strict rules for technical writing
write-good.TooWordy = warning
write-good.Passive = warning
write-good.E-Prime = NO      # technical writing uses 'is'/'are' routinely
write-good.ThereIs = warning
write-good.So = warning
proselint.Spelling = NO
proselint.Annotations = NO   # false-positives on GFM [!NOTE] admonitions
proselint.Typography = NO    # prefers unicode symbols; we use ASCII
proselint.Diacritical = NO   # 'facade' vs 'façade' is house style
proselint.DateCase = NO      # 'am'/'pm' vs 'a.m.'/'p.m.' is house style
proselint.DateSpacing = NO   # '8am' vs '8 am' is house style
proselint.But = warning
proselint.Very = warning
proselint.Uncomparables = warning
proselint.GenderBias = warning
proselint.CorporateSpeak = warning
proselint.Cliches = warning
proselint.Skunked = warning

# Readability rules disabled: technical content unavoidably scores above 10th grade.
Readability.GradeLevel = NO
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.ColemanLiau = NO
Readability.SMOG = NO
Readability.LIX = NO
Readability.AutomatedReadability = NO

[formats]
mdx = md
